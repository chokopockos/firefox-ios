name: iOS - list schemes

on:
  push:
    branches: [ webxr ]
  workflow_dispatch:

jobs:
  list:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -project Client.xcodeproj
