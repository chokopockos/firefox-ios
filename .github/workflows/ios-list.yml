name: iOS - build XRViewer (Simulator)

on:
  push:
    branches: [ webxr ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: webxr
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Setup Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Xcode version
        run: xcodebuild -version

      - name: List schemes (sanity)
        run: xcodebuild -list -project Client.xcodeproj

      # Часто firefox-ios требует Carthage. Если сборка упадёт на "missing frameworks" —
      # этот шаг обязателен. Если Carthage не нужен, он просто потратит время.
      - name: Install Carthage
        run: |
          brew update
          brew install carthage

      - name: Carthage bootstrap (best effort)
        run: |
          set -e
          # пробуем современный режим
          carthage bootstrap --platform iOS --cache-builds --use-xcframeworks || \
          # если старое — пробуем без xcframeworks
          carthage bootstrap --platform iOS --cache-builds

      - name: Build XRViewer (Simulator, no signing)
        run: |
          set -e
          xcodebuild \
            -project Client.xcodeproj \
            -scheme XRViewer \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Upload build products
        uses: actions/upload-artifact@v4
        with:
          name: XRViewer-Release-iphonesimulator
          path: build/DerivedData/Build/Products/Release-iphonesimulator/
