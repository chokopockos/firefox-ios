name: iOS - list schemes

on:
  push:
    branches: [ webxr ]
  workflow_dispatch:

jobs:
  list:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: List schemes (Client.xcodeproj)
        run: xcodebuild -list -project Client.xcodeproj
