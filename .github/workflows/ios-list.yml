name: iOS - discover xcode project

on:
  push:
    branches: [ webxr ]
  workflow_dispatch:

jobs:
  discover:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Debug - where am I?
        run: |
          set -e
          pwd
          echo "== git =="
          git rev-parse HEAD
          git branch --show-current || true
          echo "== top-level ls =="
          ls -la

      - name: Find Xcode files
        run: |
          set -e
          echo "== xcworkspace =="
          find . -maxdepth 5 -name "*.xcworkspace" -print || true
          echo "== xcodeproj =="
          find . -maxdepth 5 -name "*.xcodeproj" -print || true

      - name: List schemes (try common locations)
        run: |
          set +e
          if [ -d "Client.xcodeproj" ]; then
            echo "Found ./Client.xcodeproj"
            xcodebuild -list -project Client.xcodeproj
            exit 0
          fi

          P=$(find . -maxdepth 5 -name "Client.xcodeproj" -print -quit)
          if [ -n "$P" ]; then
            echo "Found $P"
            xcodebuild -list -project "$P"
            exit 0
          fi

          echo "Client.xcodeproj not found anywhere"
          exit 1
