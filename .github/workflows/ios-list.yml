name: iOS - discover project path

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: webxr
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Show branch/commit and root files
        run: |
          set -e
          echo "PWD=$(pwd)"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "== git =="
          git rev-parse HEAD
          git log -1 --oneline
          git branch --show-current || true
          echo "== ls root =="
          ls -la

      - name: Find Xcode projects/workspaces
        run: |
          set -e
          echo "== find *.xcodeproj =="
          find . -maxdepth 6 -name "*.xcodeproj" -print || true
          echo "== find *.xcworkspace =="
          find . -maxdepth 6 -name "*.xcworkspace" -print || true
          echo "== find Client.xcodeproj =="
          find . -maxdepth 6 -name "Client.xcodeproj" -print || true

      - name: Prove if Client.xcodeproj exists in git index
        run: |
          set -e
          echo "== git ls-files Client.xcodeproj =="
          git ls-files | grep -i "client\.xcodeproj" || true
