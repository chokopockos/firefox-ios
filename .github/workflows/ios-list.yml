name: iOS - discover xcode project

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: webxr
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Debug
        run: |
          set -e
          pwd
          git rev-parse HEAD
          git branch --show-current || true
          ls -la

      - name: Find Xcode files
        run: |
          set -e
          echo "xcodeproj:"
          find . -maxdepth 5 -name "*.xcodeproj" -print || true
          echo "xcworkspace:"
          find . -maxdepth 5 -name "*.xcworkspace" -print || true

      - name: List schemes for Client.xcodeproj (if found)
        run: |
          set -e
          P=$(find . -maxdepth 5 -name "Client.xcodeproj" -print -quit)
          echo "Client project: $P"
          test -n "$P"
          xcodebuild -list -project "$P"
